name: Publish to AUR

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

jobs:
  publish_aur_bin:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Skips gracefully until the AUR account + repo secrets are set up.
      - name: Check AUR credentials are configured
        id: creds
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "AUR_SSH_PRIVATE_KEY not set — skipping AUR publish"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get version from latest GitHub release
        if: steps.creds.outputs.configured == 'true'
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName)
          version="${tag#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing armasync-bin ${version} to AUR"

      - name: Generate PKGBUILD
        if: steps.creds.outputs.configured == 'true'
        run: |
          sed "s/VERSION_PLACEHOLDER/${{ steps.version.outputs.version }}/" \
              aur/PKGBUILD-bin.template > PKGBUILD
          cat PKGBUILD

      - name: Publish to AUR
        if: steps.creds.outputs.configured == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: armasync-bin
          pkgbuild: ./PKGBUILD
          commit_username: ${{ vars.AUR_USERNAME }}
          commit_email: ${{ vars.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ steps.version.outputs.version }}"
          updpkgsums: true
