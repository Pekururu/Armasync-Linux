name: Publish to AUR

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      commit:
        required: true
        type: string

jobs:
  publish_aur_bin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}

      # Skips gracefully until the AUR account + repo secrets are set up.
      - name: Check AUR credentials are configured
        id: creds
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "AUR_SSH_PRIVATE_KEY not set — skipping AUR publish"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate PKGBUILD
        if: steps.creds.outputs.configured == 'true'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          sed "s/VERSION_PLACEHOLDER/${RELEASE_VERSION}/" \
              aur/PKGBUILD-bin.template > PKGBUILD
          cat PKGBUILD

      - name: Publish to AUR
        if: steps.creds.outputs.configured == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: armasync-bin
          pkgbuild: ./PKGBUILD
          commit_username: ${{ vars.AUR_USERNAME }}
          commit_email: ${{ vars.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ inputs.version }}"
          updpkgsums: true
