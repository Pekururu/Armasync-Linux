[package]
name = "armasync"
version = "0.3.0"
description = "A native Linux Arma 3 launcher and addon manager"
authors = ["Armasync contributors"]
license = "GPL-3.0-only"
homepage = "https://github.com/Pekururu/Armasync-Linux"
repository = "https://github.com/Pekururu/Armasync-Linux"
edition = "2024"

[lib]
name = "armasync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
flate2 = "1"
fs2 = "0.4"
jaded = { version = "0.5", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
sha1 = "0.10"
suppaftp = "10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
url = "2"
walkdir = "2"
